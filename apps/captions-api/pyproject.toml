[project]
name = "estudio-captions-api"
version = "0.1.0"
description = "Stateless WhisperX transcription API for EStudio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
whisperx = [
  "whisperx==3.8.1",
  "torchcodec==0.7.0",
  "torchvision>=0.20.0",
  "demucs>=4.0.1",
  "faster-whisper>=1.1.0",
  "transformers>=4.52.0",
  "soundfile>=0.13.1",
  "accelerate>=1.8.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
