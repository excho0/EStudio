# Local development stack for EStudio.
#
# This compose file runs:
# - redis        : queue + realtime backing store
# - postgres     : primary relational database
# - web          : Next.js API/server runtime
# - worker       : background render/publish jobs
# - captions-api : Python transcription service

# Persistent data root can be overridden via ESTUDIO_DATA_ROOT (default: ./data).

name: estudio

services:
  # ===========================================================================
  # Core infrastructure
  # ===========================================================================

  redis:
    # Shared Redis instance for queues, pub/sub, and ephemeral runtime state.
    container_name: estudio-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Expose Redis for local tooling/debugging.
      - "6379:6379"
    volumes:
      # Persist Redis append-only data between restarts.
      - ${ESTUDIO_DATA_ROOT:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    # Primary app database used by web + worker services.
    container_name: estudio-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dev credentials/database. Replace for non-local environments.
      POSTGRES_DB: estudio
      POSTGRES_USER: estudio
      POSTGRES_PASSWORD:
    ports:
      # Expose Postgres for local clients/migrations.
      - "5432:5432"
    volumes:
      # Persist database files between container restarts.
      - ${ESTUDIO_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudio -d estudio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Application runtimes
  # ===========================================================================

  web:
    # Main Next.js runtime (API/server + studio UI).
    container_name: estudio-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      # Start only after datastore dependencies are healthy.
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      captions-api:
        condition: service_healthy
    env_file:
      # Runtime env file. Copy from .env.example and fill real values before compose up.
      - ./apps/web/.env
    environment:
      # Runtime mode
      NODE_ENV: production
      PORT: 3000

      # Public origin served through Traefik.
      AUTH_URL: ${ESTUDIO_PUBLIC_URL:-https://studio.example.com}
      NEXTAUTH_URL: ${ESTUDIO_PUBLIC_URL:-https://studio.example.com}
      NEXT_PUBLIC_APP_URL: ${ESTUDIO_PUBLIC_URL:-https://studio.example.com}
      APP_URL: ${ESTUDIO_PUBLIC_URL:-https://studio.example.com}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      NEXTAUTH_SECRET:

      # Database connection for the web runtime
      DB_DRIVER: postgres
      DATABASE_URL:

      # Shared Redis URL used by queue/socket modules
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Internal captions API URL for compose networking.
      CAPTION_REMOTE_CAPTIONS_API_URL: ${CAPTION_REMOTE_CAPTIONS_API_URL:-http://captions-api:8010}

      # Keep uploaded/media assets in the shared bind-mounted storage root.
      STORAGE_BASE_DIR: /app/data
    expose:
      # Only Traefik should reach the web runtime directly.
      - "3000"
    volumes:
      # Persist generated/app runtime data in local repo storage.
      - ${ESTUDIO_WEB_STORAGE_ROOT:-./data/apps/web}:/app/data
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.estudio.rule: Host(`${ESTUDIO_HOST:-studio.example.com}`)
      traefik.http.routers.estudio.entrypoints: websecure
      traefik.http.routers.estudio.tls: "true"
      traefik.http.routers.estudio.tls.certresolver: stepca
      traefik.http.services.estudio.loadbalancer.server.port: "3000"
    command: ["pnpm", "start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    # Background jobs runtime (render queue, publish queue, etc.).
    container_name: estudio-worker
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      captions-api:
        condition: service_healthy
      # Worker can start after web container is started (not necessarily healthy).
      web:
        condition: service_started
    env_file:
      # Runtime env file. Copy from .env.example and fill real values before compose up.
      - ./apps/web/.env
    environment:
      NODE_ENV: production

      # Database connection for worker runtime
      DB_DRIVER: postgres
      DATABASE_URL:

      # Shared Redis URL for queue workers
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Internal captions API URL for compose networking.
      CAPTION_REMOTE_CAPTIONS_API_URL: ${CAPTION_REMOTE_CAPTIONS_API_URL:-http://captions-api:8010}

      # Internal base URL for worker->web asset fetches during rendering.
      RENDER_ASSET_BASE_URL: ${RENDER_ASSET_BASE_URL:-http://web:3000}

      # Keep uploaded/media assets in the shared bind-mounted storage root.
      STORAGE_BASE_DIR: /app/data
    volumes:
      - ${ESTUDIO_WEB_STORAGE_ROOT:-./data/apps/web}:/app/data
    command: ["pnpm", "start:web:worker"]

  captions-api:
    # Python captions/transcription microservice.
    # profiles: ["captions-api"]
    container_name: estudio-captions-api
    build:
      context: .
      dockerfile: ./apps/captions-api/Dockerfile
    restart: unless-stopped
    env_file:
      # Runtime env file. Copy from .env.example and fill real values before compose up.
      - ./apps/captions-api/.env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      WHISPERX_CACHE_DIR: /app/data/cache/whisperx
      HF_HOME: /app/data/cache/huggingface
      TORCH_HOME: /app/data/cache/torch
    expose:
      # Internal-only service used by web + worker over compose networking.
      - "8010"
    volumes:
      # Persist service data/artifacts locally.
      - ${ESTUDIO_DATA_ROOT:-./data}/apps/captions-api:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 10

networks:
  proxy:
    external: true
    name: proxy
