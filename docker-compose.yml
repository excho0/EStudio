name: estudio

services:
  # ---------------------------------------------------------------------------
  # Infrastructure services
  # ---------------------------------------------------------------------------
  redis:
    container_name: estudio-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    container_name: estudio-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: excho_engine
      POSTGRES_USER: excho
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excho -d excho_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  web:
    container_name: estudio-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/web/.env.example
    environment:
      # Runtime
      NODE_ENV: production
      PORT: 3000

      # Database
      DB_DRIVER: postgres
      DATABASE_URL:

      # Redis (single shared URL; queue/socket modules can use this fallback)
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./data/apps/web:/app/data
    command: ["pnpm", "start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    container_name: estudio-worker
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    env_file:
      - ./apps/web/.env.example
    environment:
      # Runtime
      NODE_ENV: production

      # Database
      DB_DRIVER: postgres
      DATABASE_URL:

      # Redis (single shared URL; queue modules can use this fallback)
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data/apps/web:/app/data
    command: ["pnpm", "start:worker"]


  captions-api:
    container_name: estudio-captions-api
    build:
      context: ./apps/captions-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/captions-api/.env.example
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
      CAPTIONS_BACKEND: whisperx
    ports:
      - "8010:8010"
    volumes:
      - ./data/apps/captions-api:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
